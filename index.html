<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet" />
    <title>Agentify - Panel</title>
    <!-- Apply the saved theme before first paint so there's no flash. Key must match THEME_STORAGE_KEY. -->
    <script>
      try {
        var t = localStorage.getItem('agentify-theme')
      } catch (e) {}
      var dark =
        t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
